# Managed by the Turbo Spec onboarding app.
#
# Provisioned into your repository at .github/workflows/ai-watch.yml, from
# customer_bootstrap/ai-watch.yml in porsche-code/turbo-spec. Keep this header: it is
# how a future engine update can tell a file we wrote from one of your own that
# happens to call our actions.
#
# customer_bootstrap/ai-watch.yml
# Companion to customer_bootstrap/ai.yml. Copy this to .github/workflows/ai-watch.yml
# alongside .github/workflows/ai.yml in your project repo.
#
# ─── How it works ─────────────────────────────────────────────────────────
#
# When a workflow listed in `workflows:` below completes with a failure,
# this file calls the turbo-spec reusable workflow `agentic-watcher.yml`.
# That workflow:
#
#   1. Downloads the failed run's artifacts (session state, last stage
#      handoff, error excerpt).
#   2. Confirms the failed run belongs to a turbo-spec PR (see filters
#      below). If not, it exits silently — no comment, no dispatch.
#   3. Triages the failure:
#        • Regex pre-filter for obvious "needs human" cases (missing
#          secret / permission denied / missing context). Short-circuits
#          the LLM call.
#        • Otherwise → LLM (Strands + Copilot/claude-sonnet) classifies
#          the failure and writes feedback.
#        • Regex is also the fallback if the LLM errors, returns empty,
#          or violates the JSON schema — the watcher always emits a
#          decision.
#   4. Acts on the decision:
#        • `resume` + `dispatch_workflow` set → re-dispatch the engine
#          driver with the original `session_id` and generated `feedback`.
#          Skipped when a run of that workflow is already in flight, so a
#          resume cannot race an engine run driving the same session.
#        • `human` → post a PR comment with the missing-info request
#          and a `/agent <input>` resume hint.
#        • Either way → append the outcome to the run's step summary.
#
# Where the session id comes from: normally the failed run's own
# `session-state-*` artifact. A CI run uploads none, so the watcher falls back
# to the `wf-skeleton-progress` sentinel in the PR body — the same marker
# `comment-router.yml` uses to resolve a `/agent` comment. That is what makes
# the CI setup below able to auto-fix and not merely explain.
#
# ─── Filters that keep the watcher quiet on unrelated PRs ─────────────────
#
# The watcher acts ONLY when the failed run is associated with a turbo-spec
# PR. It checks two signals (either is enough):
#
#   (a) Failed run uploaded a `session-state-*` artifact (i.e. it was an
#       engine run produced by turbo-spec).
#   (b) The PR body for the failed run's head SHA contains the marker
#       `<!-- turbo-spec -->` (planted automatically by pr_creator.py on
#       every PR turbo-spec opens).
#
# If neither matches, the watcher exits with a `::notice::` and does
# nothing. This is what makes it safe to add more workflows below — the
# watcher cannot spam PRs that did not originate from turbo-spec.
#
# An additional per-session retry cap prevents resume loops: the watcher
# counts prior "Auto Resume Triggered" comments on the same PR for the
# same session and refuses to resume if any are present. Human comments
# do not consume this budget.
#
# ─── Extending: adding more workflows to watch ────────────────────────────
#
# By default we only watch the engine driver ("AI Workflow"). You can add
# any other workflow whose failures you want explained on turbo-spec PRs:
#
#   on:
#     workflow_run:
#       workflows: ["AI Workflow", "CI", "Build", "Deploy"]
#       types: [completed]
#
# Rules of thumb:
#   • The engine driver workflow (ai.yml) → include it AND set
#     `dispatch_workflow: ai.yml` below so auto-resume is wired up.
#   • Your test/lint CI workflow → include it and KEEP `dispatch_workflow`
#     set if you want the engine to fix its own red checks. The watcher
#     resolves the session from the PR body, so a failed CI job on an
#     engine-opened PR resumes that session with generated fix guidance.
#     This is how turbo-spec itself is wired (see its `.github/workflows/
#     ai-watch.yml`); it is not the default here, so opt in deliberately.
#   • Build / deploy workflows → include them in `workflows:` but leave
#     `dispatch_workflow` unset (or empty). The watcher will only explain the
#     failure as a PR comment; auto-resuming a deploy rarely makes sense.
#   • Workflows that run on every push are safe to add — the PR-origin
#     scoping above filters out anything not on a turbo-spec PR.
#
# ─── Why this lives in a separate file ────────────────────────────────────
#
# GitHub rejects a `workflow_run` trigger that listens to the workflow it
# is defined in ("workflow cannot listen to itself"). So the watcher MUST
# live in its own workflow file — it cannot be a job inside ai.yml.

name: AI Watcher

on:
  workflow_run:
    # Workflow display names (NOT filenames). Add your CI/build workflow
    # names here to also catch their failures on turbo-spec PRs — whether
    # those auto-resume or only get a comment depends on `dispatch_workflow`
    # below (see the rules of thumb above).
    workflows: ["AI Workflow"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  # The watcher's triage agent runs Copilot; the built-in GITHUB_TOKEN
  # authenticates it when no GH_COPILOT_TOKEN is set. A reusable workflow can only
  # receive the caller's permissions, so grant this here on the caller.
  copilot-requests: write

jobs:
  watch:
    # A failure on any watched workflow, plus the conclusions a hard kill
    # produces — but those only for the ENGINE run ("AI Workflow").
    #
    # A run killed by the job wall-clock cap, a cancellation, or a runner OOM
    # concludes `cancelled`/`timed_out`, never `failure`. Those runs render no
    # report at all, so without this the reviewer gets a red job and raw logs;
    # with it the watcher posts where the run died and what evidence survived
    # (REQ-KILLED-RUN-002). Nothing is auto-resumed on that path.
    #
    # Restricted to the engine's workflow FILE on purpose: if you add a CI/build
    # workflow to the `workflows:` list above, a run of it cancelled by a newer
    # push is routine and has no engine run to report on. Widen this only for a
    # workflow that drives the engine — and matching the file rather than the
    # display name means renaming your workflow cannot silently drop kill
    # reporting.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
          || (endsWith(github.event.workflow_run.path, '/ai.yml')
              && contains(fromJSON('["cancelled","timed_out"]'), github.event.workflow_run.conclusion)) }}
    # By default the onboarding app auto-pins this ref to the turbo-spec release
    # current at wiring time (the watcher then auto-derives engine_ref from it),
    # so onboarded repos track an immutable release (an explicit
    # TURBO_SPEC_ENGINE_REF overrides this; if no release resolves, onboarding
    # FAILS LOUD rather than shipping a `main`-tracking consumer). `@main` here
    # is only for manual copy-paste; for a manual install pin an exact tag and
    # bump on each release — see
    # https://github.com/porsche-code/turbo-spec/releases for the latest.
    uses: porsche-code/turbo-spec/.github/workflows/agentic-watcher.yml@v0.50.0
    with:
      failed_run_id: ${{ github.event.workflow_run.id }}
      # Enables auto-resume for EVERY workflow listed above, not just the
      # engine driver. Leave unset/empty if you want explain-only behaviour
      # for the whole list — the watcher will then never re-dispatch.
      dispatch_workflow: ai.yml
      dispatch_ref: ${{ github.event.repository.default_branch }}
      # Quoted verbatim in the killed-run surface. It never DECIDES whether a run
      # was killed — that is read from what the run left behind, because the same
      # wall-clock kill is spelled differently across platforms and job configs.
      run_conclusion: ${{ github.event.workflow_run.conclusion }}
      # engine_ref is no longer needed — agentic-watcher.yml auto-derives it from
      # the @ref in the uses: line above via job.workflow_ref.
    secrets: inherit

